name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CLOUDFLARE_SEND_METRICS: 'false'
      SITE_URL: 'https://pipesor-landing.jhon-galvezchambi.workers.dev'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Lefthook
        run: |
          curl --fail --location --retry 3 --output lefthook_2.2.2_Linux_x86_64 https://github.com/evilmartians/lefthook/releases/download/v2.2.2/lefthook_2.2.2_Linux_x86_64
          curl --fail --location --retry 3 --output lefthook_checksums.txt https://github.com/evilmartians/lefthook/releases/download/v2.2.2/lefthook_checksums.txt
          grep '  lefthook_2.2.2_Linux_x86_64$' lefthook_checksums.txt | sha256sum --check --strict
          install -m 755 lefthook_2.2.2_Linux_x86_64 "$RUNNER_TEMP/lefthook"
          rm lefthook_2.2.2_Linux_x86_64 lefthook_checksums.txt
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: lefthook validate
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      - name: Validate pull request title and squash message
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_TITLE" | bun run commitlint
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | bun run commitlint
      - name: Validate latest main commit
        if: github.event_name == 'push'
        run: bun run commitlint --last
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun run wrangler deploy --dry-run
